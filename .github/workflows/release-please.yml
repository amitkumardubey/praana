name: release-please

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  quality-gate:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun typecheck

      - name: Run tests
        run: bun run test

  build-binaries:
    needs: [release-please, quality-gate]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Compile linux-x64
        run: bun run build:compile -- --target bun-linux-x64 --outfile dist/praana-linux-x64

      - name: Compile linux-arm64
        run: bun run build:compile -- --target bun-linux-arm64 --outfile dist/praana-linux-arm64

      - name: Compile darwin-arm64
        run: bun run build:compile -- --target bun-darwin-arm64 --outfile dist/praana-darwin-arm64

      - name: Compile darwin-x64
        run: bun run build:compile -- --target bun-darwin-x64 --outfile dist/praana-darwin-x64

      - name: Smoke linux-x64
        run: |
          chmod +x dist/praana-linux-x64
          ./dist/praana-linux-x64 --version

      - name: Upload compiled binaries
        uses: actions/upload-artifact@v4
        with:
          name: release-binaries
          path: |
            dist/praana-linux-x64
            dist/praana-linux-arm64
            dist/praana-darwin-arm64
            dist/praana-darwin-x64
          if-no-files-found: error

  build-natives:
    needs: [release-please, quality-gate]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    uses: ./.github/workflows/natives-build.yml

  package-release:
    needs: [release-please, build-binaries, build-natives]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download compiled binaries
        uses: actions/download-artifact@v4
        with:
          name: release-binaries
          path: dist

      - name: Download native artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: bindings-*

      - name: Package release archives
        run: bun run package:binaries -- --dist-dir dist --native-artifacts-dir artifacts

      - name: Upload GitHub Release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.release-please.outputs.tag_name }}" dist/release/*

  publish:
    needs: [release-please, quality-gate, build-natives]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download native artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List downloaded artifacts
        run: find artifacts -type f | sort

      - name: Copy JS binding
        run: |
          cp artifacts/natives-js-binding/index.js packages/praana-natives/index.js
          cp artifacts/natives-js-binding/index.d.ts packages/praana-natives/index.d.ts

      - name: Create npm dirs and collect artifacts
        working-directory: packages/praana-natives
        run: |
          bun run create-npm-dirs
          bun run artifacts -- --output-dir ../../artifacts

      - name: Pin platform optionalDependencies
        run: bun run natives:prepare-publish

      - name: Publish platform leaves
        working-directory: packages/praana-natives
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          dirs=(npm/*/)
          if [ ${#dirs[@]} -eq 0 ]; then
            echo "No platform packages under npm/"
            exit 1
          fi
          for dir in "${dirs[@]}"; do
            echo "Publishing ${dir}"
            npm publish "${dir}" --provenance --access public
          done

      - name: Publish @praana/natives
        working-directory: packages/praana-natives
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public

      - name: Publish praana
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public
