name: natives

on:
  pull_request:
    paths:
      - "crates/**"
      - "packages/praana-natives/**"
      - "src/native/**"
      - "src/tools/code-intel.ts"
      - "tests/native-loader.test.ts"
      - "tests/code-intel-tools.test.ts"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/natives.yml"
  push:
    branches:
      - main
    paths:
      - "crates/**"
      - "packages/praana-natives/**"
      - "src/native/**"
      - "src/tools/code-intel.ts"
      - "tests/native-loader.test.ts"
      - "tests/code-intel-tools.test.ts"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/natives.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: natives-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-x64-gnu:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Cargo test
        run: cargo test -p praana-natives

      - name: Build native addon
        run: bun run natives:build

      - name: Bun smoke (direct package)
        run: bun run natives:smoke

      - name: Loader + code-intel suite slice
        run: bun test tests/native-loader.test.ts tests/code-intel-tools.test.ts
        env:
          PRAANA_REQUIRE_NATIVE: "1"

      - name: Typecheck
        run: bun typecheck
