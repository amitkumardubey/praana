name: natives

on:
  pull_request:
    paths:
      - "crates/**"
      - "packages/praana-natives/**"
      - "src/native/**"
      - "src/tools/code-intel.ts"
      - "tests/native-loader.test.ts"
      - "tests/code-intel-tools.test.ts"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/natives.yml"
      - ".github/workflows/natives-build.yml"
  push:
    branches:
      - main
    paths:
      - "crates/**"
      - "packages/praana-natives/**"
      - "src/native/**"
      - "src/tools/code-intel.ts"
      - "tests/native-loader.test.ts"
      - "tests/code-intel-tools.test.ts"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/natives.yml"
      - ".github/workflows/natives-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: natives-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/natives-build.yml
