# Temporary compile proof; remove this workflow before merging to main.
name: opentui-compile-proof

on:
  push:
    branches:
      - chore/opentui-0.8
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: bun-linux-x64
            artifact: praana-linux-x64
            smoke: true
          - runner: ubuntu-24.04-arm
            target: bun-linux-arm64
            artifact: praana-linux-arm64
            smoke: true
          - runner: macos-latest
            target: bun-darwin-arm64
            artifact: praana-darwin-arm64
            smoke: true
          - runner: macos-15-intel
            target: ""
            artifact: praana-darwin-x64
            smoke: true
          - runner: windows-latest
            target: ""
            artifact: praana-windows-x64.exe
            smoke: true
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.artifact == 'praana-darwin-x64' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Exclude musl packages for Linux x64 proof
        if: matrix.target == 'bun-linux-x64'
        shell: bash
        run: |
          set -euo pipefail
          find node_modules -name 'core-linux-*-musl' -exec rm -rf {} +
          if find node_modules -name 'core-linux-*-musl' -print -quit | grep -q .; then
            echo 'musl packages are still present' >&2
            exit 1
          fi
          echo 'OpenTUI musl packages excluded'

      - name: Compile
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${{ matrix.target }}" ]; then
            bun run build:compile -- --target "${{ matrix.target }}" --outfile "dist/${{ matrix.artifact }}"
          else
            bun run build:compile -- --outfile "dist/${{ matrix.artifact }}"
          fi

      - name: Smoke
        if: matrix.smoke
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ matrix.artifact }}" == *.exe ]]; then
            dist/${{ matrix.artifact }} --version
          else
            chmod +x dist/${{ matrix.artifact }}
            ./dist/${{ matrix.artifact }} --version
          fi
