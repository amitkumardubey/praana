[package]
name = "praana-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
praana-native-core = { path = "../praana-native-core" }
getrandom = "0.4"
ulid = { version = "3", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2"
toml = "0.8"

[dev-dependencies]
tempfile = "3"
