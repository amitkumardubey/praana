[package]
name = "praana-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[features]
failpoints = []

[[test]]
name = "crash_recovery"
path = "tests/crash_recovery.rs"
required-features = ["failpoints"]

[dependencies]
praana-native-core = { path = "../praana-native-core" }
getrandom = "0.4"
ulid = { version = "3", default-features = false, features = ["serde", "std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2"
toml = "0.8"
libc = "0.2"
fs2 = "0.4"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "sync", "time", "net", "io-util", "process"] }
async-trait = "0.1"
rusqlite = { version = "0.32", features = ["bundled"] }
zeroize = "1"
bitflags = "2.9"
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "json", "rustls-tls", "stream"] }
schemars = "1.2.2"
tokio-util = { version = "0.7", features = ["rt"] }
futures = { version = "0.3", default-features = false, features = ["std"] }
ignore = "0.4"
regex = "1"
globset = "0.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Console",
  "Win32_System_JobObjects",
  "Win32_System_Pipes",
  "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"
proptest = "1"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "sync", "time", "test-util", "net", "io-util"] }
