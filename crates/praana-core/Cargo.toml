[package]
name = "praana-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
praana-native-core = { path = "../praana-native-core" }
getrandom = "0.4"
ulid = { version = "3", default-features = false, features = ["serde", "std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2"
toml = "0.8"
libc = "0.2"
fs2 = "0.4"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }
async-trait = "0.1"
rusqlite = { version = "0.32", features = ["bundled"] }
zeroize = "1"
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "json", "rustls-tls"] }

[dev-dependencies]
tempfile = "3"
proptest = "1"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "sync", "time", "test-util"] }
