[package]
name = "praana-cli"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
praana-core = { path = "../praana-core" }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }

[dev-dependencies]
libc = "0.2"
tempfile = "3"

[[bin]]
name = "praana"
path = "src/main.rs"
