[package]
name = "praana-natives"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Native capability layer for PRAANA (napi-rs)"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
napi = { version = "3", default-features = false, features = ["napi8"] }
napi-derive = "3"
tree-sitter = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-python = "0.25"
tree-sitter-go = "0.25"
ignore = "0.4"

[build-dependencies]
napi-build = "2"

[dev-dependencies]
tempfile = "3"
