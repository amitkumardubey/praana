[package]
name = "praana-natives"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Native capability layer for PRAANA (napi-rs)"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
napi = { version = "3", default-features = false, features = ["napi8"] }
napi-derive = "3"
praana-native-core = { path = "../praana-native-core", features = ["embeddings"] }

[build-dependencies]
napi-build = "2"

[dev-dependencies]
# The contract test calls the Rust functions directly in a plain test binary
# (outside Node), so the napi symbol table must load dynamically there.
napi = { version = "3", default-features = false, features = ["napi8", "dyn-symbols"] }
tempfile = "3"
