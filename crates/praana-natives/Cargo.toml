[package]
name = "praana-natives"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Native capability layer for PRAANA (napi-rs)"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
napi = { version = "3", default-features = false, features = ["napi8"] }
napi-derive = "3"
praana-native-core = { path = "../praana-native-core", features = ["embeddings"] }

[build-dependencies]
napi-build = "2"

[dev-dependencies]
# Phase 0 exception (packet Step 7): napi_contract.rs calls the Rust #[napi]
# exports from a plain test binary outside Node, so the symbol table must load
# dynamically. Pure tests and tempfile moved to praana-native-core.
napi = { version = "3", default-features = false, features = ["napi8", "dyn-symbols"] }
