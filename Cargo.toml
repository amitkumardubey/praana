[workspace]
resolver = "2"
members = [
  "crates/praana-native-core",
  "crates/praana-natives",
]

[profile.dev]
# Line tables only keep the target directory small; backtraces still carry
# file and line numbers. `test` inherits from `dev`.
debug = "line-tables-only"

[profile.release]
lto = true
strip = "symbols"
